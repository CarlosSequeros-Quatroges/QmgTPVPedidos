<a class="volver" [routerLink]="empresa.ruta('carta')">← {{ idiomas.txt().volverCarta }}</a>

<div class="tarjeta">
  <h1 class="tarjeta__titulo">🔑 {{ idiomas.txt().codigoTitulo }}</h1>
  <p class="tarjeta__texto">{{ idiomas.txt().codigoTexto }}</p>

  <label class="tarjeta__etiqueta" for="reg-habitacion">{{ idiomas.txt().habitacion }}</label>
  <input
    id="reg-habitacion"
    class="tarjeta__input"
    type="text"
    inputmode="numeric"
    [value]="habitacion()"
    (input)="setHabitacion($any($event.target).value)"
    [placeholder]="idiomas.txt().habitacionPlaceholder"
  />

  <label class="tarjeta__etiqueta" for="reg-documento">{{ idiomas.txt().documento }}</label>
  <input
    id="reg-documento"
    class="tarjeta__input"
    type="text"
    [value]="documento()"
    (input)="setDocumento($any($event.target).value)"
    [placeholder]="idiomas.txt().documentoPlaceholder"
    autocapitalize="characters"
  />

  @if (error()) {
    <p class="tarjeta__error">✕ {{ idiomas.txt().registroError }}</p>
  }

  <button
    type="button"
    class="btn btn--primario btn--bloque"
    [disabled]="!puedeEnviar() || validando()"
    (click)="guardar()"
  >
    {{ validando() ? idiomas.txt().validando : idiomas.txt().guardar }}
  </button>

  @if (cliente.tieneCodigo()) {
    <div class="tarjeta__activo">
      <div>
        <strong>✓ {{ idiomas.txt().habitacion }} {{ cliente.habitacion() }}</strong>
        <span class="tarjeta__codigo">{{ idiomas.txt().codigoActivo }}</span>
      </div>
      <button type="button" class="enlace-borrar" (click)="borrar()">
        {{ idiomas.txt().borrar }}
      </button>
    </div>
  }
</div>
